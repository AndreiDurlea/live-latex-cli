name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      LIVELATEX_TEST_TECTONIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch GitHub dependencies over HTTPS
        shell: bash
        env:
          LIVELATEX_TOKEN: ${{ secrets.LIVELATEX_TOKEN }}
        run: |
          prefix="https://github.com/"
          if [ -n "$LIVELATEX_TOKEN" ]; then prefix="https://x-access-token:${LIVELATEX_TOKEN}@github.com/"; fi
          git config --global url."$prefix".insteadOf "ssh://git@github.com/"
          git config --global --add url."$prefix".insteadOf "https://github.com/"
      - run: npm ci
      - run: npm test
