name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      HAS_DEPLOY_KEY: ${{ secrets.LIVELATEX_DEPLOY_KEY != '' }}
      LIVELATEX_TEST_TECTONIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read the private livelatex core with its deploy key
        if: env.HAS_DEPLOY_KEY == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LIVELATEX_DEPLOY_KEY }}
      - name: Fetch GitHub dependencies over HTTPS
        if: env.HAS_DEPLOY_KEY != 'true'
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      - run: npm test
