name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      HAS_DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_ANDREIDURLEA__LIVE_LATEX_6782B5 != '' }}
      LIVELATEX_TEST_TECTONIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read the private livelatex core with its deploy key
        if: env.HAS_DEPLOY_KEY == 'true'
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_ANDREIDURLEA__LIVE_LATEX_6782B5 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/livelatex_deploy_key
          chmod 600 ~/.ssh/livelatex_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # npm sets its own GIT_SSH_COMMAND when none is present, which would override core.sshCommand.
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/livelatex_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/livelatex_deploy_key -o IdentitiesOnly=yes"
          git config --global url."ssh://git@github.com/AndreiDurlea/live-latex".insteadOf "https://github.com/AndreiDurlea/live-latex"
          git ls-remote ssh://git@github.com/AndreiDurlea/live-latex.git HEAD
          # npm runs `git submodule update --init --recursive` on git dependencies; the core's
          # submodules (cli, extension, quickstart) are not needed to build it and the key cannot read them.
          for m in cli extension quickstart; do git config --global submodule.$m.update none; done
      - name: Fetch GitHub dependencies over HTTPS
        if: env.HAS_DEPLOY_KEY != 'true'
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      - run: npm test
